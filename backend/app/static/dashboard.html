<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalTime — Dispatch Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0E1116;
    --bg-panel: #171B23;
    --bg-panel-raised: #1F2430;
    --ink: #E7EAF2;
    --ink-muted: #7C8598;
    --ink-faint: #4B5266;
    --line: #2A3040;
    --tier1: #E23D45;
    --tier1-dim: #E23D4530;
    --tier2: #E0A72E;
    --tier2-dim: #E0A72E30;
    --tier3: #4FA98A;
    --tier3-dim: #4FA98A30;
    --role-rn: #6C8EF5;
    --role-lpn: #B98CE0;
    --role-cna: #58C4D6;
    --font-label: 'IBM Plex Sans', sans-serif;
    --font-data: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-void);
    color: var(--ink);
    font-family: var(--font-label);
    -webkit-font-smoothing: antialiased;
  }

  .console {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    min-height: 100vh;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .topbar .brand .mark {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--tier3);
    display: inline-block;
    box-shadow: 0 0 0 4px var(--tier3-dim);
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .topbar .subtitle {
    font-size: 12px;
    color: var(--ink-muted);
  }
  .topbar .right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: var(--font-data);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .topbar button {
    font-family: var(--font-label);
    font-size: 12px;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .topbar button:hover {
    border-color: var(--tier1);
    color: var(--tier1);
  }
  .topbar select {
    font-family: var(--font-data);
    font-size: 11px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 5px 8px;
    border-radius: 6px;
  }

  /* ---------- tier legend strip ---------- */
  .legend {
    display: flex;
    gap: 22px;
    padding: 10px 28px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    color: var(--ink-muted);
    font-family: var(--font-data);
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ---------- main grid ---------- */
  .body-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr 0.85fr;
    gap: 1px;
    background: var(--line);
    min-height: 0;
  }
  @media (max-width: 1050px) {
    .body-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg-panel);
    padding: 20px 22px;
    overflow-y: auto;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 16px 0;
  }

  /* ---------- facility map ---------- */
  #facility-map svg { width: 100%; height: auto; display: block; }
  .room-label {
    font-family: var(--font-data);
    font-size: 12px;
    fill: var(--ink-muted);
  }
  .ns-label {
    font-family: var(--font-data);
    font-size: 11px;
    font-weight: 600;
    fill: var(--ink);
  }
  .edge-line { stroke: var(--line); stroke-width: 1.5; }
  .room-core { fill: var(--bg-panel-raised); stroke: var(--ink-faint); stroke-width: 1.5; }
  .ns-core { fill: var(--bg-panel-raised); stroke: var(--role-rn); stroke-width: 1.5; }
  .room-halo {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .room-halo.pulse { animation: pulse-ring 1.6s ease-out infinite; }
  @keyframes pulse-ring {
    0%   { r: 24; opacity: 0.55; }
    100% { r: 42; opacity: 0; }
  }
  .staff-chip {
    font-family: var(--font-data);
    font-size: 9px;
    font-weight: 600;
    fill: var(--bg-void);
  }
  .staff-chip-bg { stroke: var(--bg-panel); stroke-width: 1.5; }
  .staff-chip-bg.busy { animation: chip-breathe 1.4s ease-in-out infinite; }
  @keyframes chip-breathe {
    0%, 100% { stroke-width: 1.5; }
    50% { stroke-width: 3; }
  }

  /* ---------- event feed ---------- */
  .event-row {
    display: flex;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    align-items: flex-start;
  }
  .event-row:last-child { border-bottom: none; }
  .tier-badge {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-data);
    font-size: 13px;
    font-weight: 600;
  }
  .tier-badge.t1 { background: var(--tier1-dim); color: var(--tier1); }
  .tier-badge.t2 { background: var(--tier2-dim); color: var(--tier2); }
  .tier-badge.t3 { background: var(--tier3-dim); color: var(--tier3); }
  .event-main { flex: 1; min-width: 0; }
  .event-top-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
  }
  .event-room { font-weight: 600; }
  .event-time {
    font-family: var(--font-data);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .event-tags {
    font-size: 11.5px;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .event-status-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    font-family: var(--font-data);
    font-size: 11px;
  }
  .status-pill {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    letter-spacing: 0.03em;
  }
  .status-pill.assigned { background: #4FA98A20; color: var(--tier3); }
  .status-pill.pending { background: #E0A72E20; color: var(--tier2); }
  .status-pill.resolved { background: #ffffff10; color: var(--ink-faint); }
  .status-pill.escalated { background: #E23D4520; color: var(--tier1); }

  .empty-state {
    color: var(--ink-faint);
    font-size: 13px;
    padding: 30px 0;
    text-align: center;
  }

  /* ---------- staff roster ---------- */
  .staff-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-top-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .role-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .staff-id { font-family: var(--font-data); font-weight: 500; }
  .staff-room {
    margin-left: auto;
    font-family: var(--font-data);
    font-size: 11px;
    color: var(--ink-muted);
  }
  .staff-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-data);
    font-size: 10.5px;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .fatigue-track {
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin-top: 7px;
    overflow: hidden;
  }
  .fatigue-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--tier3);
    transition: width 0.4s ease, background 0.4s ease;
  }
  .clear-btn {
    font-family: var(--font-label);
    font-size: 10px;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    margin-top: 7px;
  }
  .clear-btn:hover { border-color: var(--tier1); color: var(--tier1); }
  .busy-tag {
    font-size: 9.5px;
    color: var(--tier1);
    background: var(--tier1-dim);
    padding: 1px 6px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="console">

  <div class="topbar">
    <div class="brand">
      <span class="mark" id="pulse-mark"></span>
      <h1>VitalTime</h1>
      <span class="subtitle">Dispatch Console</span>
    </div>
    <div class="right">
      <label for="speed-select" style="color:var(--ink-faint)">playback</label>
      <select id="speed-select">
        <option value="1">1×  (real time)</option>
        <option value="2">2×</option>
        <option value="5">5×</option>
        <option value="10">10×</option>
      </select>
      <span id="clock">--:--:--</span>
      <span id="conn-status">connecting…</span>
      <button id="reset-btn">Reset simulation</button>
    </div>

  </div>

  <div class="legend">
    <span class="item"><span class="dot" style="background:var(--tier1)"></span>Tier 1 · Emergency</span>
    <span class="item"><span class="dot" style="background:var(--tier2)"></span>Tier 2 · Validation</span>
    <span class="item"><span class="dot" style="background:var(--tier3)"></span>Tier 3 · Normal</span>
    <span class="item"><span class="dot" style="background:var(--role-rn)"></span>RN</span>
    <span class="item"><span class="dot" style="background:var(--role-lpn)"></span>LPN</span>
    <span class="item"><span class="dot" style="background:var(--role-cna)"></span>CNA</span>
  </div>

  <div class="body-grid">
    <div class="panel" id="facility-map">
      <p class="panel-title">Facility Map</p>
      <div id="map-svg-holder"></div>
    </div>

    <div class="panel">
      <p class="panel-title">Live Events</p>
      <div id="event-feed"></div>
    </div>

    <div class="panel">
      <p class="panel-title">Staff Roster</p>
      <div id="staff-roster"></div>
    </div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------------
   Facility graph — mirrors backend/app/routing/eta.py exactly.
   Layout is schematic (subway-map style), not to scale.
--------------------------------------------------------------------- */
const ROOM_COORDS = {
  "NS":  { x: 60,  y: 40 },
  "101": { x: 120, y: 120 },
  "102": { x: 280, y: 120 },
  "103": { x: 440, y: 120 },
  "104": { x: 600, y: 120 },
  "105": { x: 120, y: 300 },
  "106": { x: 280, y: 300 },
  "107": { x: 440, y: 300 },
  "108": { x: 600, y: 300 },
  "109": { x: 760, y: 300 },
  "110": { x: 920, y: 300 },
};
const EDGES = [
  ["NS","101"], ["NS","105"], ["NS","108"],
  ["101","102"], ["102","103"], ["103","104"], ["104","105"],
  ["105","106"], ["106","107"], ["107","108"], ["108","109"], ["109","110"],
  ["102","106"], ["103","107"], ["104","108"],
];
const TIER_COLOR = { 1: "var(--tier1)", 2: "var(--tier2)", 3: "var(--tier3)" };
const ROLE_COLOR = { RN: "var(--role-rn)", LPN: "var(--role-lpn)", CNA: "var(--role-cna)" };

function buildMapSVG() {
  const w = 1000, h = 360;
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  EDGES.forEach(([a, b]) => {
    const pa = ROOM_COORDS[a], pb = ROOM_COORDS[b];
    svg += `<line class="edge-line" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" />`;
  });

  Object.entries(ROOM_COORDS).forEach(([room, p]) => {
    const isNS = room === "NS";
    const r = isNS ? 18 : 24;
    svg += `<g class="room-node" data-room="${room}">`;
    svg += `<circle class="room-halo" data-halo="${room}" cx="${p.x}" cy="${p.y}" r="26" fill="none" stroke-width="3" />`;
    svg += `<circle class="${isNS ? 'ns-core' : 'room-core'}" cx="${p.x}" cy="${p.y}" r="${r}" />`;
    svg += `<text class="${isNS ? 'ns-label' : 'room-label'}" x="${p.x}" y="${p.y - r - 8}" text-anchor="middle">${room}</text>`;
    svg += `</g>`;
  });

  // One persistent layer for staff chips — chips are created once and
  // repositioned every animation frame, never rebuilt from scratch.
  // Rebuilding on every poll is what caused teleporting before.
  svg += `<g id="chips-layer"></g>`;

  svg += `</svg>`;
  document.getElementById("map-svg-holder").innerHTML = svg;
}
buildMapSVG();

/* ---------------------------------------------------------------------
   Time helper — backend serializes naive UTC datetimes with no "Z" or
   offset. new Date() on such a string is parsed as *local* time per
   spec, which silently corrupts elapsed-time math. Force UTC parsing.
--------------------------------------------------------------------- */
function parseUTC(iso) {
  if (!iso) return null;
  const hasTZ = /Z$|[+-]\d\d:\d\d$/.test(iso);
  return new Date(hasTZ ? iso : iso + "Z");
}
function timeAgo(iso) {
  const d = parseUTC(iso);
  if (!d) return "—";
  const secs = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
  if (secs < 60) return `${secs}s ago`;
  if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
  return `${Math.round(secs / 3600)}h ago`;
}

/* ---------------------------------------------------------------------
   Polling loop — fetches truth from the backend on an interval.
   Rendering staff positions is NOT done here; see the render loop below.
--------------------------------------------------------------------- */
const POLL_MS = 1500;
const FATIGUE_DISPLAY_MAX = 55; // visual normalization only, not a backend constant

let speedMultiplier = 1;
document.getElementById("speed-select").addEventListener("change", (e) => {
  speedMultiplier = Number(e.target.value);
});

async function fetchJSON(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

/* ---------------------------------------------------------------------
   Dead-reckoning render loop.

   Every staff member's transit (path + cumulative hop_times + real
   departure_time) comes straight from the backend's actual routing
   decision (app/routing/eta.py's shortest_path, the same function used
   to filter/score candidates) — the client never invents or guesses a
   route. Position on screen is a pure function of wall-clock elapsed
   time against that plan, recomputed every animation frame. There is no
   teleport: a staff member with no transit (already arrived, or never
   moved) simply renders at their current room.
--------------------------------------------------------------------- */
let latestStaff = [];

function interpolateOnPath(path, hopTimes, elapsedMinutes) {
  const total = hopTimes[hopTimes.length - 1];
  if (elapsedMinutes <= 0) return ROOM_COORDS[path[0]];
  if (elapsedMinutes >= total) return ROOM_COORDS[path[path.length - 1]];
  for (let i = 0; i < hopTimes.length - 1; i++) {
    const segStart = hopTimes[i], segEnd = hopTimes[i + 1];
    if (elapsedMinutes >= segStart && elapsedMinutes <= segEnd) {
      const t = segEnd > segStart ? (elapsedMinutes - segStart) / (segEnd - segStart) : 1;
      const a = ROOM_COORDS[path[i]], b = ROOM_COORDS[path[i + 1]];
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    }
  }
  return ROOM_COORDS[path[path.length - 1]];
}

function positionFor(s) {
  if (s.transit) {
    const departureMs = parseUTC(s.transit.departure_time).getTime();
    const elapsedMinutes = ((Date.now() - departureMs) / 60000) * speedMultiplier;
    const totalMinutes = s.transit.hop_times[s.transit.hop_times.length - 1];
    if (elapsedMinutes < totalMinutes) {
      return { pos: interpolateOnPath(s.transit.path, s.transit.hop_times, elapsedMinutes), inTransit: true };
    }
  }
  return { pos: ROOM_COORDS[s.current_position.room], inTransit: false };
}

function ensureChip(staffId, role) {
  if (document.querySelector(`[data-staff="${staffId}"]`)) return;
  const layer = document.getElementById("chips-layer");
  const color = ROLE_COLOR[role] || "var(--ink-muted)";
  layer.insertAdjacentHTML("beforeend", `
    <circle class="staff-chip-bg" data-staff="${staffId}" r="11" fill="${color}" />
    <text class="staff-chip" data-staff-label="${staffId}" text-anchor="middle" dy="3">${staffId.split("-")[0]}</text>
  `);
}

function renderFrame() {
  requestAnimationFrame(renderFrame);
  if (!latestStaff.length) return;

  const resolved = latestStaff.map(s => ({ s, ...positionFor(s) }));

  // Multiple staff at rest in the same room get a small arc offset so
  // they don't stack. Only applies to staff who have actually arrived —
  // someone mid-transit is genuinely between rooms, not "at" one.
  const arrivedByRoom = {};
  resolved.forEach(({ s, inTransit }) => {
    if (!inTransit) {
      const room = s.current_position.room;
      (arrivedByRoom[room] = arrivedByRoom[room] || []).push(s.staff_id);
    }
  });

  resolved.forEach(({ s, pos, inTransit }) => {
    ensureChip(s.staff_id, s.role);
    let { x, y } = pos;
    if (!inTransit) {
      const group = arrivedByRoom[s.current_position.room];
      const n = group.length;
      if (n > 1) {
        const idx = group.indexOf(s.staff_id);
        const angle = (idx / n) * Math.PI * 2 - Math.PI / 2;
        x += Math.cos(angle) * 28;
        y += Math.sin(angle) * 28;
      }
    }
    const bg = document.querySelector(`[data-staff="${s.staff_id}"]`);
    const label = document.querySelector(`[data-staff-label="${s.staff_id}"]`);
    if (bg) {
      bg.setAttribute("cx", x);
      bg.setAttribute("cy", y);
      bg.classList.toggle("busy", s.status === "busy");
    }
    if (label) {
      label.setAttribute("x", x);
      label.setAttribute("y", y + 3);
    }
  });
}
requestAnimationFrame(renderFrame);

function renderRoomHalos(events) {
  document.querySelectorAll(".room-halo").forEach(el => {
    el.style.opacity = 0;
    el.classList.remove("pulse");
    el.setAttribute("stroke", "transparent");
  });
  events
    .filter(e => e.status === "assigned" || e.status === "pending")
    .forEach(e => {
      const halo = document.querySelector(`[data-halo="${e.room}"]`);
      if (!halo) return;
      halo.setAttribute("stroke", TIER_COLOR[e.tier] || "var(--ink-muted)");
      halo.style.opacity = 0.7;
      if (e.tier === 1 || e.status === "pending") halo.classList.add("pulse");
    });
}

function renderEventFeed(events) {
  const el = document.getElementById("event-feed");
  if (!events.length) {
    el.innerHTML = `<div class="empty-state">Facility quiet — no events yet</div>`;
    return;
  }
  el.innerHTML = events
    .slice(0, 40)
    .map(e => `
      <div class="event-row">
        <div class="tier-badge t${e.tier}">T${e.tier}</div>
        <div class="event-main">
          <div class="event-top-line">
            <span class="event-room">Room ${e.room}</span>
            <span class="event-time">${timeAgo(e.submitted_at)}</span>
          </div>
          <div class="event-tags">${e.symptom_tags.join(", ") || "—"}</div>
          <div class="event-status-line">
            <span class="status-pill ${e.status}">${e.status}</span>
            ${e.assigned_staff_id ? `<span>&rarr; ${e.assigned_staff_id}</span>` : ""}
          </div>
        </div>
      </div>
    `)
    .join("");
}

function renderStaffRoster(staff) {
  const el = document.getElementById("staff-roster");
  if (!staff.length) {
    el.innerHTML = `<div class="empty-state">No staff data available</div>`;
    return;
  }
  const order = { RN: 0, LPN: 1, CNA: 2 };
  const sorted = [...staff].sort((a, b) =>
    (order[a.role] - order[b.role]) || a.staff_id.localeCompare(b.staff_id)
  );
  el.innerHTML = sorted
    .map(s => {
      const pct = Math.min(100, (s.fatigue_score / FATIGUE_DISPLAY_MAX) * 100);
      const barColor = pct > 66 ? "var(--tier1)" : pct > 33 ? "var(--tier2)" : "var(--tier3)";
      return `
        <div class="staff-row">
          <div class="staff-top-line">
            <span class="role-dot" style="background:${ROLE_COLOR[s.role]}"></span>
            <span class="staff-id">${s.staff_id}</span>
            ${s.status === "busy" ? `<span class="busy-tag">busy</span>` : ""}
            <span class="staff-room">${s.current_position.room}</span>
          </div>
          <div class="staff-meta">
            <span>${s.hours_in_shift.toFixed(1)}h in shift</span>
            <span>fatigue ${s.fatigue_score.toFixed(1)}</span>
          </div>
          <div class="fatigue-track"><div class="fatigue-fill" style="width:${pct}%; background:${barColor}"></div></div>
          ${s.status === "busy" && s.current_event_id
            ? `<button class="clear-btn" data-event="${s.current_event_id}">Clear assignment</button>`
            : ""}
        </div>
      `;
    })
    .join("");

  el.querySelectorAll(".clear-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Clearing…";
      try {
        await fetchJSON("/clear-assignment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event_id: btn.dataset.event }),
        });
        await poll();
      } catch (err) {
        btn.textContent = "Failed — retry";
        btn.disabled = false;
      }
    });
  });
}

let pollFailures = 0;
let pollInFlight = false;
async function poll() {
  if (pollInFlight) return; // avoid overlapping requests resolving out of order
  pollInFlight = true;
  try {
    const [staff, events] = await Promise.all([
      fetchJSON("/staff-positions"),
      fetchJSON("/events"),
    ]);
    latestStaff = staff; // consumed by the requestAnimationFrame render loop
    renderRoomHalos(events);
    renderEventFeed(events);
    renderStaffRoster(staff);
    pollFailures = 0;
    document.getElementById("conn-status").textContent = "live";
    document.getElementById("pulse-mark").style.background = "var(--tier3)";
  } catch (err) {
    pollFailures += 1;
    document.getElementById("conn-status").textContent =
      pollFailures > 2 ? "connection lost" : "reconnecting…";
    document.getElementById("pulse-mark").style.background = "var(--tier1)";
  } finally {
    pollInFlight = false;
  }
}
poll();
setInterval(poll, POLL_MS);

/* clock */
function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
tickClock();
setInterval(tickClock, 1000);

/* reset */
document.getElementById("reset-btn").addEventListener("click", async () => {
  if (!confirm("Reset the simulation? This clears all staff assignments and event history.")) return;
  await fetchJSON("/reset-simulation", { method: "POST" });
  await poll();
});
</script>
